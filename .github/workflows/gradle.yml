name: "gradle"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: "build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: "17"
          distribution: "corretto"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: deltaconcor
        run: |
          cd deltaconcor
          ./gradlew clean build
          cd ..
      - name: premigconcor
        run: |
          cd premigconcor
          ./gradlew clean build
          cd ..
      - name: verifyconcor
        run: |
          cd verifyconcor
          ./gradlew clean build
          cd ..
